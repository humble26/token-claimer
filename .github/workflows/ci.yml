# 最小 CI：推送 / PR 时跑离线单测（tests/ 下 7 个测试文件）
# 注意：代码依赖 ctypes.windll / tkinter 等 Windows 运行时，runner 必须用 windows-latest
# 本地同命令验证：191 例全绿（2026-10-05，python 3.14 / numpy / cv2）
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    env:
      # Windows runner 默认 stdout 编码（cp1252）无法打印测试中的中文描述
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python pillow

      - name: 运行离线单测
        run: python -m unittest discover -s tests -v
